services:
  - type: web
    name: bist-personal-terminal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: BIST_API_URL
        sync: false
      - key: BIST_API_KEY
        sync: false
